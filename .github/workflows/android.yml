name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'data/events-index.json'
      - 'backend/**'
      - 'README.md'
      - '.github/workflows/index-events.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "AIevents-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "AIevents-latest.apk"
          sha256sum "AIevents-${VERSION}.apk" | tee "AIevents-${VERSION}.apk.sha256"
          cat > RELEASE_NOTES.md <<EOF
          # AIevents v${VERSION}

          Native Android app for discovering current AI events worldwide.

          ## Current highlights
          - worldwide place autocomplete with coordinate/radius search
          - adaptive live discovery through multiple search engines and event sources
          - long-tail discovery for meetups, Stammtische, local chapters, university groups and research labs
          - separate Provider Radar with 240+ AI / LLM / MLOps / LLMOps ecosystems
          - online and in-person events
          - map, favourites, calendar export and reminders
          - multilingual search vocabulary
          - strict future-event filtering and relevance ranking
          - collapsible event-first search and radar interfaces

          The APK below is the current debug build produced from the tested main branch.
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIevents-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "AIevents-${VERSION}.apk" \
              "AIevents-latest.apk" \
              "AIevents-${VERSION}.apk.sha256" \
              --clobber
            gh release edit "$TAG" \
              --title "AIevents v$VERSION" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" \
              "AIevents-${VERSION}.apk" \
              "AIevents-latest.apk" \
              "AIevents-${VERSION}.apk.sha256" \
              --target "$GITHUB_SHA" \
              --title "AIevents v$VERSION" \
              --notes-file RELEASE_NOTES.md
          fi
